[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chessgpt-inference"
version = "0.1.0"
description = "ChessGPT: a decoder-only transformer for chess move generation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Matthieu Alcouffe" },
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "safetensors>=0.4",
    "huggingface_hub",
    "python-chess>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebook = ["anywidget>=0.9", "ipywidgets>=8.0"]

[project.urls]
Repository = "https://github.com/malcouffe/chessgpt-inference"
"Model Weights" = "https://huggingface.co/malcouffe/chessgpt"

[project.scripts]
chessgpt-generate = "chessgpt.generate:main"

[tool.setuptools.packages.find]
include = ["chessgpt*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]
